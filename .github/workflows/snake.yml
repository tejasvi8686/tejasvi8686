name: generate snake animation

on:
  # Once a day. `0 */24 * * *` also worked out to daily, but only ever fired at
  # hour 0 — this says the same thing plainly.
  schedule:
    - cron: "0 0 * * *"

  # allows the job to be run manually at any time
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the generated svg to the output branch

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          # Must be the GitHub username, not a display name — the previous value
          # ("Tejasvi-Raj") does not resolve to an account, so the action had
          # nothing to read a contribution graph from.
          github_user_name: tejasvi8686
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
